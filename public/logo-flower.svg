
<svg width="400" height="400" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8c5845" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Octagonal Stationery Card with Chamfered Corners -->
  <g filter="url(#cardShadow)">
    <path d="M 120 40 L 380 40 L 460 120 L 460 380 L 380 460 L 120 460 L 40 380 L 40 120 Z" 
          fill="#ffffff" stroke="#e05238" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 132 62 L 368 62 L 438 132 L 438 368 L 368 438 L 132 438 L 62 368 L 62 132 Z" 
          fill="#fffaf6" stroke="#f0cfc2" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Modern Graphic Wild Rose -->
  <g transform="translate(150, 95) scale(1.15)">
    <!-- Branch with leaves -->
    <path d="M 90 270 Q 105 190 90 120" stroke="#241b16" stroke-width="9" fill="none" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M 90 205 Q 30 175 40 225 Q 75 235 90 205" fill="#618c74" stroke="#241b16" stroke-width="7" stroke-linejoin="round"/>
    <!-- Right Leaf -->
    <path d="M 92 150 Q 155 120 145 170 Q 110 180 92 150" fill="#618c74" stroke="#241b16" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Central Eglantine 5-Petal Open Flower -->
    <g transform="translate(90, 80)">
      <circle cx="0" cy="-35" r="30" fill="#ffa894" stroke="#241b16" stroke-width="7"/>
      <circle cx="33" cy="-11" r="30" fill="#ffa894" stroke="#241b16" stroke-width="7"/>
      <circle cx="21" cy="28" r="30" fill="#ffa894" stroke="#241b16" stroke-width="7"/>
      <circle cx="-21" cy="28" r="30" fill="#ffa894" stroke="#241b16" stroke-width="7"/>
      <circle cx="-33" cy="-11" r="30" fill="#ffa894" stroke="#241b16" stroke-width="7"/>

      <!-- Flower Center -->
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#241b16" stroke-width="7"/>
      <circle cx="0" cy="0" r="15" fill="#e05238"/>
      <!-- Golden pistil dots -->
      <circle cx="0" cy="-8" r="2.5" fill="#ffffff"/>
      <circle cx="8" cy="0" r="2.5" fill="#ffffff"/>
      <circle cx="0" cy="8" r="2.5" fill="#ffffff"/>
      <circle cx="-8" cy="0" r="2.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
